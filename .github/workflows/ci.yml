name: CI

# Public fork code is not admitted to the project-scoped Runmux pool.
# Push checks validate each trusted branch head and remain visible on its PR.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Runmux
    runs-on: air-msgraph
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" != 0
          case "$RUNNER_NAME" in rmx-air-*) ;; *) exit 1 ;; esac

  test:
    name: Test
    needs: canary
    runs-on: air-msgraph
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Prepare writable executable tool directories
        run: |
          mkdir -p "$RUNNER_TEMP/toolcache" "$RUNNER_TEMP/go-tmp"
          printf 'TMPDIR=%s\nGOTMPDIR=%s\n' "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/go-tmp" >> "$GITHUB_ENV"
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          go-version: '1.26.2'
          cache: false
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod download -modfile=tools.go.mod
          go mod verify
          go mod verify -modfile=tools.go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
      - name: Test
        run: |
          go tool -modfile=tools.go.mod gotestsum --format pkgname-and-test-fails -- -race ./...
          go build ./...
      - name: Lint
        run: |
          go tool -modfile=tools.go.mod golangci-lint run --timeout=5m
